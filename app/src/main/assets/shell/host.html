<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PdfCraft</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #f1f1f3;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #19191c; }
        }
        #pdfcraft-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- data-src is assigned to src by host.js AFTER message listeners are registered -->
    <iframe
        id="pdfcraft-frame"
        title="PdfCraft"
        data-src="../pdfcraft/index.html?host=parent"
        allow="fullscreen; clipboard-read; clipboard-write"
        allowfullscreen>
    </iframe>
    <script src="host.js"></script>
</body>
</html>
